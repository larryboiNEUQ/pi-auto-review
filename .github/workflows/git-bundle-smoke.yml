name: Git bundle smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-load:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/arm64
          - os: windows-latest
            platform: win32/x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the pinned Pi CLI
        run: npm install --global @earendil-works/pi-coding-agent@0.81.0

      - name: Install the bundle workspace
        run: npm ci --ignore-scripts

      - name: Typecheck both permission packages
        run: npm run check

      - name: Verify chat and Jev approval behavior without inference credentials
        env:
          # The runner context is available at step scope, not job-level env.
          # Git install/update smoke creates its own isolated directories.
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-auto-review-ci
        run: npm test

      - name: Verify the committed extension matches its sources
        run: npm run build -- --check

      - name: Authenticate Git without changing the recorded source URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node -e "const { spawnSync } = require('node:child_process');
          const token = Buffer.from('x-access-token:' + process.env.GH_TOKEN).toString('base64');
          const result = spawnSync('git', ['config', '--global', 'http.https://github.com/.extraheader', 'AUTHORIZATION: basic ' + token], { stdio: 'inherit' });
          process.exit(result.status ?? 1);"

      - name: Verify real Git install, load, and update
        run: node scripts/verify-git-bundle.mjs --source https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}@${{ github.event.pull_request.head.sha || github.sha }} --expect-platform ${{ matrix.platform }}

      - name: Verify a changed-HEAD Git update reinstalls dependencies
        run: node scripts/verify-git-bundle.mjs --expect-platform ${{ matrix.platform }}

  native-batch-cancellation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.85.1", "0.99.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install an unmodified compatible Pi beside the workspace
        run: npm install --prefix "${{ runner.temp }}/native-pi-host" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - name: Verify per-call approval and stopping prepared calls on native Pi
        env:
          PI_AUTO_REVIEW_TEST_HOST_ROOT: ${{ runner.temp }}/native-pi-host/node_modules/@earendil-works/pi-coding-agent
        run: npm exec --workspace packages/pi-permission-safe-allow -- vitest run --config ../../scripts/native-pi-vitest.config.mjs

      - name: Verify real Pi loading, child forwarding, and older extension dependencies
        env:
          PI_NATIVE_ROOT: ${{ runner.temp }}/native-pi-host/node_modules/@earendil-works/pi-coding-agent
        run: node scripts/verify-per-call-batches.mjs --pi-root "$PI_NATIVE_ROOT" --peer-root "$GITHUB_WORKSPACE/node_modules/@earendil-works/pi-coding-agent" --output "${{ runner.temp }}/per-call-real-pi-${{ matrix.pi }}.json"
      - name: Verify older Pi cannot borrow a newer extension dependency's capability
        if: matrix.pi == '0.99.1'
        env:
          PI_NATIVE_ROOT: ${{ runner.temp }}/native-pi-host/node_modules/@earendil-works/pi-coding-agent
        run: node scripts/verify-per-call-batches.mjs --pi-root "$GITHUB_WORKSPACE/node_modules/@earendil-works/pi-coding-agent" --peer-root "$PI_NATIVE_ROOT" --expect-blocked --output "${{ runner.temp }}/per-call-legacy-host.json"
